{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page_obj.has_previous %}<a class="button secondary" href="{% querystring page=page_obj.previous_page_number %}">← Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registros</span>
  {% if page_obj.has_next %}<a class="button secondary" href="{% querystring page=page_obj.next_page_number %}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
